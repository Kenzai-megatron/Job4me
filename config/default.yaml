# Job4me configuration (ADR 0005).
# Every threshold, duration, quota, cap and price lives here, never in the code.
# Machine-specific values go in config/local.yaml (not committed).
# Secrets never go in these files: they are files in secrets/ (pnpm setup:dev, setup:home).

app:
  # Address the browser uses. On the home machine: https://job4me.<tailnet>.ts.net
  publicOrigin: http://localhost:5173
  # Extra origins accepted on state-changing requests outside production (the API port in dev).
  extraOrigins:
    - http://localhost:3000
  # WebAuthn relying party: the host name of publicOrigin.
  rpId: localhost
  rpName: Job4me
  listenHost: 127.0.0.1
  listenPort: 3000

auth:
  session:
    idleTimeoutMinutes: 720 # 12 hours of inactivity
    absoluteTimeoutHours: 168 # 7 days at most
    reauthWindowMinutes: 5 # sensitive actions need a check younger than this
    touchIntervalSeconds: 60 # how often activity is written back
  enrollmentLinkMinutes: 15
  challengeMinutes: 5
  passwordStepMinutes: 5 # time allowed between the password and the second factor
  password:
    minLength: 12
    maxLength: 256
    argon2: # RFC 9106, second recommended option
      memoryKiB: 65536
      iterations: 3
      parallelism: 4
  lockout:
    threshold: 5 # consecutive failures before the first wait
    baseDelaySeconds: 60
    maxDelaySeconds: 3600
  rateLimit:
    authRequestsPerMinute: 30
  totp:
    issuer: Job4me
    window: 1 # accepted steps before and after the current one
  recoveryCodes:
    count: 10

http:
  bodyLimitBytes: 1048576

mail:
  # Development and tests only accept Mailpit (CLAUDE.md).
  smtpHost: 127.0.0.1
  smtpPort: 1025
  from: Job4me <job4me@example.invalid>

push:
  # VAPID contact: set your own mailto: or https: address in config/local.yaml.
  vapidSubject: mailto:job4me@example.invalid
  # Test notifications a signed-in user may request per minute (push services throttle senders).
  testRequestsPerMinute: 6

profile:
  # Search radius around the base city when the profile sets none (SPEC section 4).
  defaultRadiusKm: 40
  maxTargetJobs: 3
  # Search keywords (docs/SOURCES.md, section 1.3): full list and priority ones.
  keywords:
    min: 25
    max: 35
    priority: 10
  # Completeness: weight of each rubric (they add up to 100) and the entries it needs.
  completeness:
    identity: { weight: 10, min: 1 }
    practical: { weight: 10, min: 1 }
    motivations: { weight: 5, min: 1 }
    targetJobs: { weight: 15, min: 1 }
    keywords: { weight: 15, min: 25 }
    experiences: { weight: 15, min: 1 }
    facts: { weight: 10, min: 3 }
    skills: { weight: 10, min: 3 }
    languages: { weight: 5, min: 1 }
    education: { weight: 5, min: 1 }

files:
  # Files volume. Containers mount it here; outside a container set JOB4ME_FILES_DIR
  # (pnpm setup:dev writes <repository>/var/files into .env).
  dir: /var/lib/job4me/files

# Imported CVs and LinkedIn archive (plan, section 4; ADR 0010).
imports:
  maxFileBytes: 5242880 # 5 MB
  uploadsPerHour: 20
  listLimit: 20
  # Archives (DOCX, LinkedIn ZIP): checked on the central directory before anything is inflated.
  archive:
    maxEntries: 1000
    maxTotalUncompressedBytes: 52428800 # 50 MB
    maxEntryUncompressedBytes: 20971520 # 20 MB
    maxCompressionRatio: 100
    # Small entries compress oddly without being bombs: the ratio is checked from 1 MB.
    minRatioCheckBytes: 1048576
  maxPdfPages: 30
  maxExtractedChars: 200000
  maxLinkedinRows: 5000
  # Extracted text and decided proposals erased this long after the review (ADR 0010).
  extractedRetentionDays: 30
  # Isolated extractor: one file at a time, in a thread with its own memory and time budget.
  extractor:
    pollIntervalMs: 2000
    timeoutMs: 60000
    memoryMb: 256
    maxAttempts: 3
    # A run still in extraction after this long is taken again (the extractor stopped).
    staleAfterMs: 300000

# Claude API (plan, section 5; ADR 0009). The key is secrets/anthropic_api_key on the home
# machine only: empty or absent, the AI is off and everything else keeps working.
ai:
  # Hypothèse (plan, decision P4): checked before every call, from the ai_call log.
  caps:
    weeklyUsd: 2 # rolling 7 days
    totalUsd: 10 # the whole of phase 1
  timeoutMs: 120000
  maxRetries: 2
  # Cautious estimate of a request before it is sent (French text: about 3.5 characters a token).
  charsPerToken: 3
  cvStructuring:
    model: claude-haiku-5-5
    maxTokens: 16000
    effort: medium
  keywords:
    model: claude-sonnet-5-5
    maxTokens: 8000
    effort: high
    # Server-side fallback when Claude Sonnet 5.5 declines (Anthropic chooses the model).
    fallbacks: true
    requestsPerHour: 10
    # A request still pending after this long no longer blocks a new one.
    staleAfterMs: 600000
  structuring:
    pollIntervalMs: 3000
    # A structuring still running after this long is taken again (the worker stopped).
    staleAfterMs: 600000
  # USD per million tokens, Anthropic price list of 3/11/2026 (check before relying on them).
  # Cache reads are 0.1x the input price, 5-minute cache writes 1.25x.
  prices:
    claude-haiku-5-5: { input: 0.10, output: 0.50, cacheRead: 0.01, cacheWrite: 0.125 }
    claude-sonnet-5-5: { input: 2, output: 10, cacheRead: 0.10, cacheWrite: 2.5 }
  # A fallback model is not known in advance: priced like an Opus-class model, to stay cautious.
  unknownModelPrice: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }

# Job offer collection (phase 2 plan; ADR 0013 to 0015). Rules of docs/SOURCES.md, section 0:
# a private person's pace, pauses, a full stop at the first 403 or 429, one switch per source.
collect:
  # personal, or commercial: LinkedIn guest and the public pages then switch off (ADR 0014).
  usageMode: personal
  # One pass a day at 7:10 in Brussels; each source runs on its own days (decision D3).
  schedule:
    cron: '10 7 * * *'
    timeZone: Europe/Brussels
  # 30 minutes for the whole pass: on Tuesday and Friday the public pages and LinkedIn add up
  # to more than the 15 minutes of docs/SOURCES.md, which counted the secondary sources only.
  passBudgetMs: 1800000
  # A pass still running after this long is marked interrupted (the worker stopped).
  staleAfterMs: 2700000
  http:
    # Ordinary browser headers (docs/SOURCES.md, section 0): update the version now and then.
    userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
    acceptLanguage: fr-BE,fr;q=0.9,nl;q=0.8,en;q=0.7
    timeoutMs: 20000
    maxResponseBytes: 5242880 # 5 MB
    maxRedirects: 3
    # Wait before the first retry of an API, doubled at each one.
    retryBaseMs: 2000
  offers:
    maxDescriptionChars: 1200
    # Decision D5 (ADR 0015): an offer not seen for 90 days is deleted.
    retentionDays: 90
    # ADR 0016 (docs/SOURCES.md, section 1.6): a new posting joins an announcement seen within
    # the last three weeks; past them, the same offer seen again is a new announcement.
    historyDays: 21
    listLimit: 50
  runs:
    retentionDays: 365
    perSource: 8
    # The figures of each source on the Sources screen: four weeks (SPEC, section 9).
    windowDays: 28
  # Silent source (decision D4: a notification on the phone and a banner on the Sources screen):
  # nothing read without any error, or less than a quarter of the usual volume (the median of
  # the six previous runs, when it reaches ten offers). Test passes never count.
  mute:
    history: 6
    minUsual: 10
    collapseRatio: 0.25
  manual:
    maxTextChars: 20000
    addsPerHour: 30
  test:
    requestsPerHour: 6
  # Development and tests only (JOB4ME_COLLECT_DEMO_SOURCE, written by pnpm setup:dev): the demo
  # source, offers made up without any request, replaces every real source.
  demoSource: false
  # The city of the sites searched by city name (StepStone, Talent.com), and the centre of the
  # searches around a point (Forem) while the profile's base city is not found (ADR 0017).
  area:
    name: Bruxelles
    lat: 50.8467
    lon: 4.3517
  # One entry per connector, in calling order. weekdays: 1 = Monday. Pauses and budgets of
  # docs/SOURCES.md; maxAgeDays: older ads are neither asked for nor kept; params: the source's own.
  sources:
    actiris:
      weekdays: [1, 2, 3, 4, 5, 6, 7]
      pauseMs: 2000
      budgetMs: 180000
      retries: 2
      maxPages: 3
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      maxAgeDays: 60
      params: { pageSize: 100 }
    forem:
      weekdays: [1, 2, 3, 4, 5, 6, 7]
      pauseMs: 300
      budgetMs: 120000
      retries: 2
      maxPages: 2
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      maxAgeDays: 60
      params: { pageSize: 100 }
    adzuna:
      weekdays: [1, 2, 3, 4, 5, 6, 7]
      pauseMs: 1000
      budgetMs: 120000
      retries: 2
      maxPages: 2
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      maxAgeDays: 60
      # Only "Bruxelles" and "Brussel" are understood, never "Brussels" (docs/SOURCES.md).
      params: { where: Bruxelles, pageSize: 50 }
    # 250 searches a month on the free plan: three days a week with the priority keywords
    # (about 130 searches), and a reserve kept for the tests. Checked before every pass.
    google_jobs:
      weekdays: [1, 3, 5]
      pauseMs: 1000
      budgetMs: 120000
      retries: 1
      maxPages: 1
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      params: { location: 'Brussels, Belgium', language: fr, country: be, quotaReserve: 20 }
    # Public pages (lot 3): Tuesday and Friday (decision D3), 3 s between two pages of a site,
    # a single attempt, personal use only. StepStone searches with OR: the title filter sorts.
    stepstone:
      weekdays: [2, 5]
      pauseMs: 3000
      budgetMs: 180000
      retries: 0
      maxPages: 3
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      maxAgeDays: 60
      params: { pageSize: 25 }
    jobijoba:
      weekdays: [2, 5]
      pauseMs: 3000
      budgetMs: 120000
      retries: 0
      maxPages: 2
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
    jobrapido:
      weekdays: [2, 5]
      pauseMs: 3000
      budgetMs: 120000
      retries: 0
      maxPages: 2
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
    # Many old ads on Talent.com: the age limit keeps the recent ones.
    talent:
      weekdays: [2, 5]
      pauseMs: 3000
      budgetMs: 120000
      retries: 0
      maxPages: 2
      cooldownHoursAfterBlock: 0
      enabledByDefault: true
      maxAgeDays: 60
    # LinkedIn guest (lot 4, docs/SOURCES.md): the ten priority keywords, 20 s between two calls,
    # one attempt, page by page; after a 403 or 429, no call at all for 24 hours.
    linkedin:
      weekdays: [2, 5]
      pauseMs: 20000
      budgetMs: 300000
      retries: 0
      maxPages: 3
      cooldownHoursAfterBlock: 24
      enabledByDefault: true
      maxAgeDays: 7
      params: { location: 'Brussels, Belgium', pageSize: 10 }
    demo:
      weekdays: [1, 2, 3, 4, 5, 6, 7]
      pauseMs: 0
      budgetMs: 60000
      retries: 0
      maxPages: 1
      cooldownHoursAfterBlock: 0
      enabledByDefault: true

# Encrypted backups (plan, section 9; ADR 0012): pnpm stack:backup, pnpm stack:restore-test.
# Geography (phase 3 plan, section 5; ADR 0017; docs/SOURCES.md, section 1.7).
geo:
  # Road distance = straight line × 1.25 (the Belgian average); radius: profile.defaultRadiusKm.
  roadFactor: 1.25
  # A place name carried by two places further apart than this is not guessed.
  ambiguityKm: 15
  # Four figures in this range are years, not postal codes (« 2026 »).
  yearsFrom: 2020
  yearsTo: 2035
backups:
  keepDaily: 14
  keepWeekly: 8

worker:
  purgeCron: '17 * * * *' # every hour
  expiredSessionRetentionDays: 30
  consumedTokenRetentionDays: 7
