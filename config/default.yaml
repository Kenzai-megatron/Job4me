# Job4me configuration (ADR 0005).
# Every threshold, duration, quota, cap and price lives here, never in the code.
# Machine-specific values go in config/local.yaml (not committed).
# Secrets never go in these files: they are files in secrets/ (pnpm setup:dev, setup:home).

app:
  # Address the browser uses. On the home machine: https://job4me.<tailnet>.ts.net
  publicOrigin: http://localhost:5173
  # Extra origins accepted on state-changing requests outside production (the API port in dev).
  extraOrigins:
    - http://localhost:3000
  # WebAuthn relying party: the host name of publicOrigin.
  rpId: localhost
  rpName: Job4me
  listenHost: 127.0.0.1
  listenPort: 3000

auth:
  session:
    idleTimeoutMinutes: 720 # 12 hours of inactivity
    absoluteTimeoutHours: 168 # 7 days at most
    reauthWindowMinutes: 5 # sensitive actions need a check younger than this
    touchIntervalSeconds: 60 # how often activity is written back
  enrollmentLinkMinutes: 15
  challengeMinutes: 5
  passwordStepMinutes: 5 # time allowed between the password and the second factor
  password:
    minLength: 12
    maxLength: 256
    argon2: # RFC 9106, second recommended option
      memoryKiB: 65536
      iterations: 3
      parallelism: 4
  lockout:
    threshold: 5 # consecutive failures before the first wait
    baseDelaySeconds: 60
    maxDelaySeconds: 3600
  rateLimit:
    authRequestsPerMinute: 30
  totp:
    issuer: Job4me
    window: 1 # accepted steps before and after the current one
  recoveryCodes:
    count: 10

http:
  bodyLimitBytes: 1048576

mail:
  # Development and tests only accept Mailpit (CLAUDE.md).
  smtpHost: 127.0.0.1
  smtpPort: 1025
  from: Job4me <job4me@example.invalid>

push:
  # VAPID contact: set your own mailto: or https: address in config/local.yaml.
  vapidSubject: mailto:job4me@example.invalid
  # Test notifications a signed-in user may request per minute (push services throttle senders).
  testRequestsPerMinute: 6

profile:
  # Search radius around the base city when the profile sets none (SPEC section 4).
  defaultRadiusKm: 40
  maxTargetJobs: 3
  # Search keywords (docs/SOURCES.md, section 1.3): full list and priority ones.
  keywords:
    min: 25
    max: 35
    priority: 10
  # Completeness: weight of each rubric (they add up to 100) and the entries it needs.
  completeness:
    identity: { weight: 10, min: 1 }
    practical: { weight: 10, min: 1 }
    motivations: { weight: 5, min: 1 }
    targetJobs: { weight: 15, min: 1 }
    keywords: { weight: 15, min: 25 }
    experiences: { weight: 15, min: 1 }
    facts: { weight: 10, min: 3 }
    skills: { weight: 10, min: 3 }
    languages: { weight: 5, min: 1 }
    education: { weight: 5, min: 1 }

files:
  # Files volume. Containers mount it here; outside a container set JOB4ME_FILES_DIR
  # (pnpm setup:dev writes <repository>/var/files into .env).
  dir: /var/lib/job4me/files

# Imported CVs and LinkedIn archive (plan, section 4; ADR 0010).
imports:
  maxFileBytes: 5242880 # 5 MB
  uploadsPerHour: 20
  listLimit: 20
  # Archives (DOCX, LinkedIn ZIP): checked on the central directory before anything is inflated.
  archive:
    maxEntries: 1000
    maxTotalUncompressedBytes: 52428800 # 50 MB
    maxEntryUncompressedBytes: 20971520 # 20 MB
    maxCompressionRatio: 100
    # Small entries compress oddly without being bombs: the ratio is checked from 1 MB.
    minRatioCheckBytes: 1048576
  maxPdfPages: 30
  maxExtractedChars: 200000
  maxLinkedinRows: 5000
  # Isolated extractor: one file at a time, in a thread with its own memory and time budget.
  extractor:
    pollIntervalMs: 2000
    timeoutMs: 60000
    memoryMb: 256
    maxAttempts: 3
    # A run still in extraction after this long is taken again (the extractor stopped).
    staleAfterMs: 300000

worker:
  purgeCron: '17 * * * *' # every hour
  expiredSessionRetentionDays: 30
  consumedTokenRetentionDays: 7
