name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tools pinned by version, and by checksum when downloaded (Renovate proposes new versions;
  # the checksum then comes from the release's own checksums file).
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # renovate: datasource=pypi depName=semgrep
  SEMGREP_VERSION: 1.185.0
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: 1.57.2
  SYFT_SHA256: ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --no-banner --verbose .

  lint:
    name: Format, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: job4me_owner
          POSTGRES_PASSWORD: ci-owner-throwaway
          POSTGRES_DB: job4me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job4me_owner -d job4me"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      JOB4ME_ENV: test
      JOB4ME_DATABASE_OWNER_URL: postgres://job4me_owner:ci-owner-throwaway@127.0.0.1:5432/job4me
      JOB4ME_DATABASE_URL: postgres://job4me_app:ci-app-throwaway-password@127.0.0.1:5432/job4me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate a throwaway master key
        run: echo "JOB4ME_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm test:integration

  security:
    name: Security (Semgrep, audit, zizmor, Compose, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Semgrep rule tests
        run: pipx run --spec "semgrep==${SEMGREP_VERSION}" semgrep --test --metrics=off --config .semgrep/job4me.yml .semgrep/job4me.ts
      - name: Semgrep (project rules, then the TypeScript, Node.js and OWASP rulesets)
        run: >-
          pipx run --spec "semgrep==${SEMGREP_VERSION}" semgrep scan --error --metrics=off
          --config .semgrep --config p/typescript --config p/nodejs --config p/owasp-top-ten
      - name: Dependency audit (production at moderate and above, everything at high)
        run: |
          pnpm audit --prod --audit-level moderate
          pnpm audit --audit-level high
      - name: Workflow analysis (zizmor)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline .github/workflows
      - name: Compose hardening and published ports
        run: pnpm check:compose
      - name: SBOM (CycloneDX, from the lockfile)
        run: |
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" syft
          ./syft scan dir:. --source-name job4me --exclude './**/node_modules/**' -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  e2e:
    name: End-to-end tests on the containers (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway secrets and settings
        run: pnpm setup:dev
      - name: Build the image and start the stack as on the home machine
        run: pnpm stack:up
      - name: Install Chromium for Playwright
        # The runner image already holds Chromium's system libraries; when its package mirrors
        # fail, install the browser alone instead of failing the run.
        run: |
          pnpm --filter @job4me/e2e exec playwright install --with-deps chromium \
            || pnpm --filter @job4me/e2e exec playwright install chromium
      - name: Specs against the containers (production mode)
        run: pnpm test:e2e:stack
      - name: Container logs
        if: failure()
        run: pnpm stack:logs
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
